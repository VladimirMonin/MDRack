[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdrack-sqlite-vec"
version = "0.1.0"
description = "Experimental sqlite-vec compatibility probe for mdrack-sqlite"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "mdrack-sqlite==1.0.0rc1",
    "sqlite-vec==0.1.9",
]

[tool.uv.sources]
mdrack-sqlite = { path = "../mdrack-sqlite", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/mdrack_sqlite_vec"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/src/mdrack_sqlite_vec",
]
